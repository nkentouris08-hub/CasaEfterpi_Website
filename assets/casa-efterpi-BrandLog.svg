<svg width="600" height="460" viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
<title>Casa Efterpi logo lockup</title>
<desc>Full logo lockup: CE monogram above a thin gold rule, the Casa Efterpi wordmark, and a Samos, Greece location line, in Cormorant Garamond on transparent background</desc>
<g transform="translate(200,20) scale(0.5)">
<text x="178" y="232" font-family="Cormorant Garamond, Georgia, serif" font-size="170" text-anchor="middle" fill="#4A3520">C</text>
<text x="220" y="232" font-family="Cormorant Garamond, Georgia, serif" font-size="137" text-anchor="middle" fill="#C8A96A">E</text>
</g>
<line x1="230" y1="290" x2="370" y2="290" stroke="#C8A96A" stroke-width="2"/>
<text x="300" y="370" font-family="Cormorant Garamond, Georgia, serif" font-size="52" letter-spacing="12" text-anchor="middle" fill="#4A3520">CASA EFTERPI</text>
<text x="300" y="410" font-family="Cormorant Garamond, Georgia, serif" font-size="22" letter-spacing="8" text-anchor="middle" fill="#7A5C38">SAMOS &#183; GREECE</text>
</svg>
